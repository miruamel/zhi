<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 96" role="img" aria-label="Zhi section glyphs">
  <title>Zhi section glyphs</title>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
    <g transform="translate(0,0)">
      <rect width="120" height="32" rx="6" fill="#0b0d12" stroke="#7cf3a4" stroke-width="1"/>
      <text x="14" y="22" fill="#7cf3a4" font-weight="700">⟶  PLAN</text>
    </g>
    <g transform="translate(130,0)">
      <rect width="120" height="32" rx="6" fill="#0b0d12" stroke="#5fb3ff" stroke-width="1"/>
      <text x="14" y="22" fill="#5fb3ff" font-weight="700">⟴  BUILD</text>
    </g>
    <g transform="translate(260,0)">
      <rect width="120" height="32" rx="6" fill="#0b0d12" stroke="#f59e0b" stroke-width="1"/>
      <text x="14" y="22" fill="#f59e0b" font-weight="700">◉  CRITIQUE</text>
    </g>
    <g transform="translate(390,0)">
      <rect width="120" height="32" rx="6" fill="#0b0d12" stroke="#a78bfa" stroke-width="1"/>
      <text x="14" y="22" fill="#a78bfa" font-weight="700">✓  EVAL</text>
    </g>
    <g transform="translate(520,0)">
      <rect width="120" height="32" rx="6" fill="#0b0d12" stroke="#22d3ee" stroke-width="1"/>
      <text x="14" y="22" fill="#22d3ee" font-weight="700">⇡  COMMIT</text>
    </g>
    <g transform="translate(650,0)">
      <rect width="120" height="32" rx="6" fill="#0b0d12" stroke="#34d399" stroke-width="1"/>
      <text x="14" y="22" fill="#34d399" font-weight="700">⊕  DONE</text>
    </g>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#9aa6b2">
    <text x="0" y="58">Section glyphs used as section headers in docs. Each color = one state in the conductor.</text>
    <text x="0" y="78">▶ running · ✓ done · ○ pending · ✗ failed · ◉ scoring · ⟶ forward · ⟴ loop · ⇡ up · ⊕ complete</text>
  </g>
</svg>
