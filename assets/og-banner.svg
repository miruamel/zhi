<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Zhi — autonomous coding agent">
  <title>Zhi — autonomous coding agent</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#11151c"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf3a4"/>
      <stop offset="1" stop-color="#5fb3ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(80,120)">
    <g fill="none" stroke="url(#line)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 12 L80 92"/>
      <path d="M80 12 L10 92"/>
    </g>
    <circle cx="100" cy="6" r="6" fill="#7cf3a4"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto" fill="#e6edf3">
    <text x="80" y="280" font-size="78" font-weight="800">Zhi</text>
    <text x="80" y="330" font-size="28" fill="#9aa6b2">志 · autonomous coding agent</text>
    <text x="80" y="420" font-size="22" fill="#cbd5e1">loop → build → critic → eval → commit → PR → CI → done</text>
    <text x="80" y="460" font-size="20" fill="#7cf3a4">15-critic plant · weighted Pareto · bounded retry · git worktree</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#7cf3a4" opacity="0.85">
    <text x="80" y="560">$ zhi run "tambah validasi email di auth.ts, test hijau, buka PR"</text>
    <text x="80" y="585" fill="#9aa6b2">▸ INTAKE → PLAN → ISOLATE → EXECUTE → CRITIQUE → EVALUATE → COMMIT → PR → CI → DONE</text>
  </g>
</svg>
