<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" role="img" aria-label="Zhi documentation">
  <title>Zhi (志) — autonomous coding agent</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#11151c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf3a4"/>
      <stop offset="1" stop-color="#5fb3ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="120" fill="url(#bg)"/>
  <g transform="translate(40,30)">
    <g fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
