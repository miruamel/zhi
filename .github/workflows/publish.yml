name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.1). Leave blank to use latest tag."
        required: false
        default: ""

permissions:
  contents: write
  id-token: write # Required for npm provenance (sigstore)

jobs:
  release:
    name: Build + Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm to latest
        run: npm install -g npm@11

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: npm ci

      - name: Gate (lint + format + typecheck + test)
        run: bun run gate

      - name: Setup Zig 0.16.0 (direct download; setup-zig mirror lacks 0.16.0)
        run: |
          ZIG_VER=0.16.0
          URL="https://ziglang.org/download/${ZIG_VER}/zig-x86_64-linux-${ZIG_VER}.tar.xz"
          curl -fsSL "$URL" -o /tmp/zig.tar.xz
          tar -xf /tmp/zig.tar.xz -C /opt
          echo "/opt/zig-x86_64-linux-${ZIG_VER}" >> "$GITHUB_PATH"

      - name: Build Zig WASM
        run: bun run native:build

      - name: Build TypeScript to dist/
        run: bun run build

      - name: Publish to npm (@miruamel/zhi) via OIDC Trusted Publisher
        # Trusted Publisher sudah terdaftar di npmjs.com (miruamel/zhi → publish.yml,
        # scopes: npm publish + npm stage publish). Pakai OIDC; tidak butuh NPM_TOKEN.
        run: |
          # `id-token: write` (line 16) + `--provenance` (sigstore) memberi npmjs.com
          # signed OIDC token dari GitHub Actions → npm verify trust → publish.
          npm publish --provenance --access public
          echo "[release] published to npm registry via OIDC"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Validate tag format (vX.Y.Z only) to prevent awk-regex injection.
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag format '$TAG' (expected vX.Y.Z)"
            exit 1
          fi
          VERSION="${TAG#v}"
          # Extract notes dari CHANGES.md untuk version ini (section [X.Y.Z]).
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' CHANGES.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release $TAG. Lihat CHANGES.md untuk detail."
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES" \
            --target main \
            --verify-tag
          echo "[release] GitHub Release created for $TAG"
