name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.1). Leave blank to use latest tag."
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: npm ci

      - name: Gate
        run: bun run gate

  prepare:
    name: Prepare build
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: npm ci

      - name: Setup Zig 0.16.0
        run: |
          ZIG_VER=0.16.0
          URL="https://ziglang.org/download/${ZIG_VER}/zig-x86_64-linux-${ZIG_VER}.tar.xz"
          curl -fsSL "$URL" -o /tmp/zig.tar.xz
          tar -xf /tmp/zig.tar.xz -C /opt
          echo "/opt/zig-x86_64-linux-${ZIG_VER}" >> "$GITHUB_PATH"

      - name: Build Zig WASM
        run: bun run native:build

      - name: Build TypeScript to dist/
        run: bun run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  build-binary:
    name: Build binary (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: [gate, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            ext: ""
          - os: macos-latest
            platform: macos-x64
            ext: ""
          - os: macos-latest
            platform: macos-arm64
            ext: ""
          - os: windows-latest
            platform: windows-x64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: List dist contents
        run: ls -la dist/ && ls -la dist/src/cli/

      - name: Build binary (${{ matrix.platform }})
        id: build
        run: |
          FILE="zhi-${{ matrix.platform }}${{ matrix.ext }}"
          bun build --compile ./dist/src/cli/index.js --outfile "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Compute checksum
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            certutil -hashfile "${{ steps.build.outputs.file }}" SHA256 | grep -v ":" | tr -d " " > "${{ steps.build.outputs.file }}.sha256"
          else
            shasum -a 256 "${{ steps.build.outputs.file }}" > "${{ steps.build.outputs.file }}.sha256"
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: |
            ${{ steps.build.outputs.file }}
            ${{ steps.build.outputs.file }}.sha256

  npm-publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: npm ci

      - name: Setup Zig 0.16.0
        run: |
          ZIG_VER=0.16.0
          URL="https://ziglang.org/download/${ZIG_VER}/zig-x86_64-linux-${ZIG_VER}.tar.xz"
          curl -fsSL "$URL" -o /tmp/zig.tar.xz
          tar -xf /tmp/zig.tar.xz -C /opt
          echo "/opt/zig-x86_64-linux-${ZIG_VER}" >> "$GITHUB_PATH"

      - name: Build WASM
        run: bun run native:build

      - name: Build dist
        run: bun run build

      - name: Publish to npm
        run: npm publish --provenance --access public

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [gate, build-binary, npm-publish]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: artifacts/
          merge-multiple: true

      - name: Display artifacts
        run: ls -lh artifacts/

      - name: Create GitHub Release
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag format '$TAG'"
            exit 1
          fi
          VERSION="${TAG#v}"

          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' CHANGES.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release $TAG"
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES" \
            --target main \
            --verify-tag \
            artifacts/*.exe \
            artifacts/zhi-* \
            artifacts/*.sha256

          echo "[release] GitHub Release created for $TAG"
