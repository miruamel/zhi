name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: Gate (lint + format + typecheck + test + arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install gitleaks
        run: |
          rm -rf /tmp/gitleaks
          curl -LsSf https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar xz -C /tmp/
          echo "/tmp/gitleaks" >> $GITHUB_PATH

      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --no-git --verbose
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Architecture invariants (files-per-dir + SLOC + circular)
        run: |
          bun run arch:check
          bun run arch:metrics

      - name: Architecture guard (custom bash checks)
        run: bash .github/workflows/architecture-guard.sh

      - name: Gate (lint + format + typecheck + test, docs-only fast-path)
        run: bun run gate

  build:
    name: Build TypeScript + Native WASM
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Zig 0.14.0 (direct download; setup-zig mirror lacks 0.14.0)
        run: |
          curl -L https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /tmp/
          echo "ZIG_BIN=/tmp/zig-linux-x86_64-0.14.0/zig" >> $GITHUB_ENV

      - name: Build TypeScript
        run: bun run build

      - name: Build Zig WASM
        run: bun run native:build
