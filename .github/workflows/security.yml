name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly security scan — every Monday 03:00 UTC
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: typescript, javascript
          build-mode: none
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: npm ci

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --json > /tmp/audit.json || true

      - name: Report audit results
        run: |
          if [ -s /tmp/audit.json ]; then
            echo "=== npm audit summary ==="
            node -e 'const d=require("/tmp/audit.json");const v=d.vulnerabilities||{};for(const s of ["critical","high","moderate","low"]){const c=v[s]||0;if(c>0)console.log(s+": "+c)}'
          fi
