name: architecture-guard

on: [push, pull_request]
permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Files per directory (<=5; root exempt §6.2; ADR-005/ADR-006 allow docs/design, audit-log/entries)
        run: bash .github/workflows/architecture-guard.sh .

      - name: SLOC per code file (<=200)
        run: bash .github/workflows/architecture-guard.sh . --sloc-only
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup Zig 0.16.0 (direct download; setup-zig mirror lacks 0.16.0)
        run: |
          ZIG_VER=0.16.0
          URL="https://ziglang.org/download/${ZIG_VER}/zig-x86_64-linux-${ZIG_VER}.tar.xz"
          curl -fsSL "$URL" -o /tmp/zig.tar.xz
          tar -xf /tmp/zig.tar.xz -C /opt
          echo "/opt/zig-x86_64-linux-${ZIG_VER}" >> "$GITHUB_PATH"
      - name: Build native wasm (stream)
        run: cd native/stream && bash build.sh
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: dependency-cruiser (circular + layer separation)
        run: npx dependency-cruiser --config dependency-cruiser.config.cjs --validate --exclude '\.test\.(ts|js|tsx|jsx)$|__tests__|\.spec\.(ts|js)$|dist|node_modules' src/ engine/ scripts/ native/
      - name: bun test
        run: bun test
