name: architecture-guard

on: [push, pull_request]
permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Files per directory (<=5; root exempt §6.2; ADR-005/ADR-006 allow docs/design, audit-log/entries)
        run: bash .github/workflows/architecture-guard.sh .

      - name: SLOC per code file (<=200)
        run: bash .github/workflows/architecture-guard.sh . --sloc-only

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Zig 0.14.0 (direct download; setup-zig mirror lacks 0.14.0)
        run: |
          curl -L https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /tmp/
          echo "ZIG_BIN=/tmp/zig-linux-x86_64-0.14.0/zig" >> $GITHUB_ENV

      - name: Build native wasm (stream)
        run: bun run native:build

      - name: dependency-cruiser (circular + layer separation)
        run: bunx dependency-cruiser --config dependency-cruiser.config.cjs --validate --exclude '\.test\.(ts|js|tsx|jsx)$|__tests__|\.spec\.(ts|js)$|dist|node_modules' src/ engine/ scripts/ native/

      - name: bun test
        run: bun test
